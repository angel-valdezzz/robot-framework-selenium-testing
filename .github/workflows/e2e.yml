name: ParaBank E2E
on:
  push:
    branches: [main, feature/evidence-reporter]
    paths: ["tests/**", "config/**", "use_cases/**", "poetry.lock", ".github/workflows/e2e.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run robot --outputdir results tests
      - name: Generar reportes de negocio
        if: always()
        run: poetry run rf-evidence build results/evidence --output results/business-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parabank-results
          path: results/
          retention-days: 7
