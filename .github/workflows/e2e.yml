name: ParaBank E2E
on:
  push:
    branches: [main, "feature/**"]
    paths: ["tests/**", "config/**", "use_cases/**", "poetry.lock", "requirements.txt", ".github/workflows/e2e.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: robot --outputdir results tests
      - name: Generar reportes de negocio
        if: always()
        run: rf-evidence build results/evidence --output results/business-reports --formats html pdf docx
      - name: Verificar formatos y manifiesto
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('results/business-reports')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['cases'], 'No se generaron reportes'
          for case in manifest['cases']:
              reports = [item for item in case['files'] if item['type'] in {'html', 'pdf', 'docx'}]
              assert {item['type'] for item in reports} == {'html', 'pdf', 'docx'}
              assert all((root / item['path']).stat().st_size > 0 for item in reports)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parabank-results
          path: results/
          retention-days: 7
