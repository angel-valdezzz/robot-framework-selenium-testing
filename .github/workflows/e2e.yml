name: ParaBank E2E
on:
  push:
    branches: [main, "feature/**"]
    paths: ["tests/**", "config/**", "use_cases/**", "poetry.lock", "requirements.txt", ".github/workflows/e2e.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: robot --outputdir results tests
      - name: Generar reportes de negocio
        if: always()
        run: rf-evidence build results/evidence --output results/business-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parabank-results
          path: results/
          retention-days: 7
