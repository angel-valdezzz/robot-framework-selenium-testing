name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run robocop check Tests UseCases Config
      - run: poetry run robocop format --check Tests UseCases Config
      - run: poetry run pytest -q
      - run: poetry run robot --dryrun --outputdir results/dryrun Tests
