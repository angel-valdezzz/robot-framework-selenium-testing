name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: robocop check tests use_cases config
      - run: robocop format --check tests use_cases config
      - run: robot --dryrun --outputdir results/dryrun tests
