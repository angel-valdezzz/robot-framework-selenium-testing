[tool.poetry]
name = "robot-framework-selenium-testing"
version = "0.1.0"
description = "ParaBank: Robot Framework, SeleniumLibrary y datos con PyTabify"
authors = ["Angel Gerardo Molina Valdez"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
robotframework = "7.5.0"
robotframework-seleniumlibrary = "6.9.0"
robotframework-datadriver = "1.11.2"
pytabify = "3.0.0"
robotframework-faker = "^6.0.0"

[tool.poetry.group.dev.dependencies]
robotframework-robocop = "9.1.0"

[tool.robocop.lint]
ignore = ["too-few-calls-in-test-case"]
